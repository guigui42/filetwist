name: Set up cached browser tests
description: Restore npm downloads and pinned Chromium binaries on Ubuntu 24.04.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: tests/browser/package-lock.json
    - name: Install browser test dependencies
      shell: bash
      run: npm --prefix tests/browser ci --prefer-offline
    - name: Cache Chromium
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-${{ hashFiles('tests/browser/package-lock.json') }}
    # Always install OS libraries; Playwright skips browser downloads on a cache hit.
    - name: Install Chromium and system dependencies
      shell: bash
      working-directory: tests/browser
      run: npx playwright install --with-deps chromium
