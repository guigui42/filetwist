name: Set up cached GoReleaser
description: Install a pinned GoReleaser binary on Linux and reuse it across jobs.

inputs:
  version:
    description: GoReleaser release version
    default: v2.18.1

runs:
  using: composite
  steps:
    - name: Cache GoReleaser binary
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/filetwist/goreleaser/${{ inputs.version }}
        key: goreleaser-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}
    - name: Download GoReleaser
      if: steps.cache.outputs.cache-hit != 'true'
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
      with:
        distribution: goreleaser
        version: ${{ inputs.version }}
        install-only: true
    - name: Store downloaded binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GORELEASER_VERSION: ${{ inputs.version }}
      run: |
        install -D -m 0755 "$(command -v goreleaser)" \
          "$HOME/.cache/filetwist/goreleaser/$GORELEASER_VERSION/goreleaser"
    - name: Add cached binary to PATH
      shell: bash
      env:
        GORELEASER_VERSION: ${{ inputs.version }}
      run: |
        bin="$HOME/.cache/filetwist/goreleaser/$GORELEASER_VERSION"
        test -x "$bin/goreleaser"
        echo "$bin" >> "$GITHUB_PATH"
