name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.1
          args: check
      - name: Build release snapshot
        run: goreleaser release --snapshot --clean
      - name: Check Compose configurations
        run: make packaging-compose-config

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build Linux runtime image
        run: make packaging-build IMAGE=filetwist:ci VERSION="$GITHUB_SHA"
      - name: Exercise required runtime codecs and conversions
        run: scripts/validate-container.sh filetwist:ci
      - name: Enforce image size budget
        run: scripts/measure-container.sh filetwist:ci
      - name: Install browser test dependencies
        run: npm --prefix tests/browser ci
      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium
      - name: Exercise browser workflow
        run: make test-browser IMAGE=filetwist:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: tests/browser/test-results/
          retention-days: 7
          if-no-files-found: ignore
