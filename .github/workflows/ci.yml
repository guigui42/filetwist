name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-release-artifacts:
        description: Retain non-publishing snapshot artifacts for a release dry run
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install GoReleaser
        uses: ./.github/actions/setup-goreleaser
      - name: Validate release configuration
        run: goreleaser check
      - name: Build release snapshot
        run: goreleaser release --snapshot --clean
      - name: Check Compose configurations
        run: make packaging-compose-config
      - name: Collect release dry-run artifacts
        if: inputs.upload-release-artifacts
        run: cp .release/filetwist-source-commit.txt dist/
      - name: Upload release dry-run artifacts
        if: inputs.upload-release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run-${{ github.run_attempt }}
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/filetwist-source-commit.txt
          retention-days: 7
          if-no-files-found: error

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          cache-binary: true
      - name: Build Linux runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: filetwist:ci
          build-args: |
            VERSION=${{ github.sha }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,version=2,scope=filetwist-runtime
          cache-to: type=gha,version=2,mode=max,scope=filetwist-runtime
      - name: Exercise required runtime codecs and conversions
        run: scripts/validate-container.sh filetwist:ci
      - name: Enforce image size budget
        run: scripts/measure-container.sh filetwist:ci
      - name: Prepare browser tests
        uses: ./.github/actions/setup-browser-tests
      - name: Exercise browser workflow
        run: make test-browser IMAGE=filetwist:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: tests/browser/test-results/
          retention-days: 7
          if-no-files-found: ignore
