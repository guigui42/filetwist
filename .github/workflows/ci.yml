name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-release-artifacts:
        description: Retain non-publishing snapshot artifacts for a release dry run
        type: boolean
        default: false
      release-tag:
        description: Build and retain this version's validated OCI candidate for the release chain
        type: string
        default: ''
    outputs:
      candidate-artifact:
        description: Validated OCI artifact for the release container job
        value: ${{ jobs.container.outputs.candidate-artifact }}
      candidate-revision:
        description: Exact source commit validated by the container job
        value: ${{ jobs.container.outputs.candidate-revision }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Install GoReleaser
        uses: ./.github/actions/setup-goreleaser
      - name: Validate release configuration
        run: goreleaser check
      - name: Build release snapshot
        run: goreleaser release --snapshot --clean
      - name: Check Compose configurations
        run: make packaging-compose-config
      - name: Collect release dry-run artifacts
        if: inputs.upload-release-artifacts
        run: cp .release/filetwist-source-commit.txt dist/
      - name: Upload release dry-run artifacts
        if: inputs.upload-release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dry-run-${{ github.run_attempt }}
          compression-level: 0
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/filetwist-source-commit.txt
          retention-days: 7
          if-no-files-found: error

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      candidate-artifact: ${{ steps.candidate.outputs.artifact-id }}
      candidate-revision: ${{ steps.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set candidate metadata
        id: metadata
        env:
          TAG: ${{ inputs.release-tag }}
        run: |
          python3 scripts/container-sources.py metadata \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --revision "$(git rev-parse HEAD)"
      - name: Build and validate once for CI and downstream release
        id: candidate
        uses: ./.github/actions/prepare-container
        with:
          image: ${{ steps.metadata.outputs.image }}
          tag: ${{ steps.metadata.outputs.tag }}
          version: ${{ steps.metadata.outputs.version }}
          revision: ${{ steps.metadata.outputs.sha }}
          source-url: ${{ steps.metadata.outputs.source_url }}
          upload-candidate: ${{ inputs.release-tag != '' }}
