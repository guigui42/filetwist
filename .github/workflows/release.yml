name: Release
run-name: "${{ github.event_name == 'workflow_dispatch' && 'Release dry run' || 'Release' }}: ${{ github.ref_name }}"

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - name: Require a version tag
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/container-sources.py metadata \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --revision "$(git rev-parse HEAD)"
      - name: Describe dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Manual dry run: CI and snapshot artifacts only. No tag, release, or image will be published.' \
            >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      upload-release-artifacts: ${{ github.event_name == 'workflow_dispatch' }}
      release-tag: ${{ github.event_name == 'push' && github.ref_name || '' }}

  binaries:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Install GoReleaser
        uses: ./.github/actions/setup-goreleaser
      - name: Publish binaries
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    if: github.event_name == 'push'
    needs: [validate, binaries]
    uses: ./.github/workflows/container-publish.yml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      tag: ${{ github.ref_name }}
      candidate-artifact: ${{ needs.validate.outputs.candidate-artifact }}
      candidate-revision: ${{ needs.validate.outputs.candidate-revision }}
