name: Release
run-name: "${{ github.event_name == 'workflow_dispatch' && 'Release dry run' || 'Release' }}: ${{ github.ref_name }}"

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Existing version tag created for this release
        required: true
        type: string
      release-sha:
        description: Exact default-branch commit identified by the release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      release-tag: ${{ steps.release.outputs.release-tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: github.event_name == 'push' || inputs.release-tag != ''
        with:
          ref: ${{ inputs.release-tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release mode
        id: release
        env:
          INPUT_TAG: ${{ inputs.release-tag }}
          INPUT_SHA: ${{ inputs.release-sha }}
        run: |
          tag=
          if test "$GITHUB_EVENT_NAME" = push; then
            tag=$GITHUB_REF_NAME
          elif test -n "$INPUT_TAG"; then
            tag=$INPUT_TAG
            test -n "$INPUT_SHA"
            test "$(git rev-parse HEAD)" = "$INPUT_SHA" || {
              echo "::error::$tag does not identify the requested release commit"
              exit 1
            }
          fi

          if test -z "$tag"; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'release-tag=' >> "$GITHUB_OUTPUT"
            echo 'Manual dry run: CI and snapshot artifacts only. No tag, release, or image will be published.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 scripts/container-sources.py metadata \
            --repository "$GITHUB_REPOSITORY" --tag "$tag" --revision "$(git rev-parse HEAD)"
          echo 'publish=true' >> "$GITHUB_OUTPUT"
          echo "release-tag=$tag" >> "$GITHUB_OUTPUT"

  validate:
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      upload-release-artifacts: ${{ needs.tag.outputs.publish != 'true' }}
      release-tag: ${{ needs.tag.outputs.release-tag }}

  binaries:
    if: needs.tag.outputs.publish == 'true'
    needs: [tag, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.tag.outputs.release-tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Install GoReleaser
        uses: ./.github/actions/setup-goreleaser
      - name: Publish binaries
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    if: needs.tag.outputs.publish == 'true'
    needs: [tag, validate, binaries]
    uses: ./.github/workflows/container-publish.yml
    permissions:
      actions: read
      contents: write
      packages: write
    with:
      tag: ${{ needs.tag.outputs.release-tag }}
      candidate-artifact: ${{ needs.validate.outputs.candidate-artifact }}
      candidate-revision: ${{ needs.validate.outputs.candidate-revision }}
